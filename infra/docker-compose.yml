# ==============================================================================
# DOCKER COMPOSE — SMART PANTRY ASSISTANT MVP (RNF03 & RNF05)
# Orquestra Backend API (Node/TS + Gemini), Frontend (React/Vite) e n8n.
# Execução: docker compose -f infra/docker-compose.yml up -d --build
# ==============================================================================

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smart_pantry_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    volumes:
      - pantry_local_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: smart_pantry_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: smart_pantry_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-troque_esta_senha_segura}
      # Credenciais isoladas para fluxos HTTP (RNF05)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_INTERNAL_URL=http://backend:3001
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/workflows:ro
    depends_on:
      - backend

volumes:
  n8n_data:
  pantry_local_data:
